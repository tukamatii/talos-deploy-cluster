      docker.io:
        endpoints:
          - https://gitlab.okbtsp.corp:443
    config:
      gitlab.okbtsp.corp:
        auth:
          username: svc-oit-docker-registry-read
          password: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            35333432326665323335323763663766383734316534636466633637653063393331613031373633
            6662653237643531323634343662306462363764646132370a663238373134636432346265663966
            33356139356330366664653461386663306136633962643665393461333735663762663362363565
            6635333164353937620a386662303265346465643866323731303062623962306661616135636636
            36303665616536346330373961613336663931643738613137653739343237353435

  time:
